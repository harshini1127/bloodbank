<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body { background:#9b0c0c; margin:0; font-family:Arial; }
        .container {
            width:350px; background:white; padding:25px;
            border-radius:10px; margin:90px auto;
        }
        h2 { text-align:center; color:#9b0c0c; }
        input{
            width:100%; padding:10px; margin-top:5px;
            margin-bottom:15px; border-radius:6px; border:1px solid gray;
        }
        button{
            width:100%; padding:10px; background:#9b0c0c;
            border:none; color:white; font-size:16px;
            border-radius:6px; cursor:pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Login</h2>

        <label>Email</label>
        <input type="email" id="email">

        <label>Password</label>
        <input type="password" id="password">

        <button onclick="login()">Login</button>

    </div>

    <script>
        function login(){
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            alert("Login Attempt\nEmail: "+email+"\nPassword: "+password);
        }
    </script>

</body>
</html>
