<!DOCTYPE html>
<html>
<head>
    <title>Blood Bank Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial;
            background: #9b0c0c;
        }

        .container {
            width: 380px;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            margin: 100px auto;
            box-shadow: 0px 0px 10px #310404;
        }

        h2 {
            text-align: center;
            color: #9b0c0c;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid gray;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            background: #9b0c0c;
            color: white;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #7a0808;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
        }

        .footer a {
            color: #9b0c0c;
            text-decoration: none;
        }
    </style>

</head>

<body>

    <div class="container">
        <h2>Blood Bank Login</h2>

        <form>

            <label>Email</label>
            <input type="email" placeholder="Enter email">

            <label>Password</label>
            <input type="password" placeholder="Enter password">

            <button type="submit">Login</button>

        </form>

        <div class="footer">
            Don't have an account?
            <a href="#">Register</a>
        </div>
    </div>

</body>

</html>
