<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Blood</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

<header>
    <h1>Blood Request Form</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="admindashboard.html">Admin</a>
    </nav>
</header>

<main>
    <section class="form-section">
        <h2>Fill Blood Request Details</h2>

        <form id="requestForm">

            <label>Full Name:</label>
            <input type="text" id="fullname" required />

            <label>Age:</label>
            <input type="number" id="age" min="1" required />

            <label>Blood Group:</label>
            <select id="bloodGroup" required>
                <option value="">Select</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>

            <label>Units Required:</label>
            <input type="number" id="units" min="1" required />

            <label>Mobile Number:</label>
            <input type="text" id="mobile" required />

            <label>Reason for Request:</label>
            <textarea id="reason" required></textarea>

            <button type="submit">Submit Request</button>
        </form>

        <p id="responseMessage"></p>
    </section>
</main>

<script>
document.getElementById("requestForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const data = {
        fullname: document.getElementById("fullname").value,
        age: document.getElementById("age").value,
        bloodGroup: document.getElementById("bloodGroup").value,
        units: document.getElementById("units").value,
        mobile: document.getElementById("mobile").value,
        reason: document.getElementById("reason").value
    };

    try {
        const response = await fetch("http://127.0.0.1:5000/request-blood", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        document.getElementById("responseMessage").textContent = result.message;
        document.getElementById("responseMessage").style.color = "green";

        document.getElementById("requestForm").reset();
    }
    catch (error) {
        document.getElementById("responseMessage").textContent = "Error sending request!";
        document.getElementById("responseMessage").style.color = "red";
    }
});
</script>

</body>
</html>
