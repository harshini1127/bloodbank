<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Request Blood</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header>
<h1>Hospital Blood Request</h1>
<a href="index.html">Home</a>
</header>


<main>
<form id="requestForm">
<label>Hospital ID: <input type="text" name="hospitalId" required></label>
<label>Blood Group:
<select name="bloodGroup">
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>
</select>
</label>
<label>Units Required: <input type="number" name="unitsRequired" min="1" required></label>
<button type="submit">Submit Request</button>
</form>
<div id="req-msg"></div>
</main>


<script src="js/main.js"></script>
</body>
</html>
